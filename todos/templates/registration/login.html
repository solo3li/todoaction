{% extends 'todos/base.html' %}

{% block title %}Login - Todo App{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label><br>
                {{ field }}
                {% if field.errors %}
                    <p style="color: var(--danger-color); font-size: 0.8rem;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" style="width: 100%;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
        Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
    </p>
{% endblock %}
