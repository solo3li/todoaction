<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .todo-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
    <h1>Todo List</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="New todo..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for todo in todos %}
            <li class="todo-item">
                <span class="{% if todo.completed %}completed{% endif %}">{{ todo.title }}</span>
                <div>
                    <a href="{% url 'toggle_todo' todo.pk %}">{% if todo.completed %}Undo{% else %}Done{% endif %}</a>
                    <a href="{% url 'delete_todo' todo.pk %}" onclick="return confirm('Are you sure?')">Delete</a>
                </div>
            </li>
        {% empty %}
            <li>No todos yet!</li>
        {% endfor %}
    </ul>
</body>
</html>
